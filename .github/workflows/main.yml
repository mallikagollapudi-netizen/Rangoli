name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Initialize EAS Project
        working-directory: ./frontend
        run: eas init --account blahblahblah23 --non-interactive

      - name: Configure Expo for APK
        working-directory: ./frontend
        run: |
          echo '{
            "build": {
              "preview": {
                "distribution": "internal",
                "android": {
                  "buildType": "apk"
                }
              }
            }
          }' > eas.json

      - name: Build the APK
        working-directory: ./frontend
        run: eas build --platform android --profile preview --local --output rangoli.apk

      - name: Upload Finished File
        uses: actions/upload-artifact@v4
        with:
          name: rangoli-apk
          path: frontend/rangoli.apk
